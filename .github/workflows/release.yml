name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: debang-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (deb, AppImage, rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            curl \
            wget \
            file \
            patchelf
          # Optional: only needed for tray icons, which deBang does not use.
          # Never let an unavailable optional package fail the whole build.
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev \
            || echo "::notice::optional package libayatana-appindicator3-dev not available — continuing"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: deBang Launcher ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          releaseBody: |
            Готовые сборки deBang Launcher.

            Linux: `.deb`, `.rpm`, `.AppImage`
            Windows: `.msi`, `.exe` (NSIS)

            Требования: WebKitGTK 4.1 (Linux) / WebView2 (Windows) и Java
            для Minecraft (8/17/21/25 — в зависимости от версии игры).
          args: --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-bundles
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: warn

  windows:
    name: Windows (msi, NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: deBang Launcher ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          releaseBody: |
            Windows-сборка deBang Launcher (`.msi` и `.exe`).

            Требуется WebView2 Runtime — он предустановлен в Windows 11 и в
            свежих сборках Windows 10.
          args: --bundles nsis,msi
      - name: Diagnostics (bundle output)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -ErrorAction SilentlyContinue |
            Select-Object -First 40 FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-bundles
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
